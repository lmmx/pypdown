[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12"]

[dependency-groups]
docs = ["mkdocstrings[python]>=1.0", "zensical>=0.0.11"]
test = [
  "pytest>=8.2.2"
]
vercel = [
  "urllib3<2"
]

[project]
name = "pypdown"
version = "0.1.5"
description = "A Pydantic model-based approach to data pipelining with file I/O linting."
authors = [
  {name = "Louis Maddox", email = "louismmx@gmail.com"}
]
dependencies = [
  "pydantic>=2.12"
]
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries"
]

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
  "pre-commit>=4.1.0"
]

[tool.pdm]
distribution = true

[tool.uv]
default-groups = ["docs", "test"]
